apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: oracle-dbaas
  title: Database as a Service
  description: Fully Managed or Self-Managed DBaaService
  tags:
    - database
    - oracle
    - postgresql
    - sql-server
    - mongodb
spec:
  owner: platform-team
  type: database

  parameters:
    - title: Service Type
      required: [supportModel, dbProduct]
      properties:
        supportModel:
          title: Support Model
          type: string
          enum: [fully-managed, self-supported]
          enumNames: ['Fully Managed Service', 'Self-Supported']
          ui:field: BoxedChoice
          ui:options:
            columns: 2
        dbProduct:
          title: Database Product
          type: string
          enum: [oracle, sqlserver, mongodb, postgresql]
          enumNames: ['Oracle', 'SQL Server', 'MongoDB', 'PostgreSQL']
          ui:field: BoxedChoice
          ui:options:
            columns: 2
      dependencies:
        dbProduct:
          oneOf:
            - properties:
                dbProduct:
                  enum: [oracle]
                dbVersion:
                  title: Version
                  type: string
                  enum: ['23ai', '19c']
                  enumNames: ['Oracle 23ai (Latest)', 'Oracle 19c (N-1)']
                  ui:field: BoxedChoice
                  ui:options:
                    columns: 2
              required: [dbVersion]
            - properties:
                dbProduct:
                  enum: [sqlserver]
                dbVersion:
                  title: Version
                  type: string
                  enum: ['2025', '2022']
                  enumNames:
                    ['SQL Server 2025 (Latest)', 'SQL Server 2022 (N-1)']
                  ui:field: BoxedChoice
                  ui:options:
                    columns: 2
              required: [dbVersion]
            - properties:
                dbProduct:
                  enum: [mongodb]
                dbVersion:
                  title: Version
                  type: string
                  enum: ['8.0', '7.0']
                  enumNames: ['MongoDB 8.0 (Latest)', 'MongoDB 7.0 (N-1)']
                  ui:field: BoxedChoice
                  ui:options:
                    columns: 2
              required: [dbVersion]
            - properties:
                dbProduct:
                  enum: [postgresql]
                dbVersion:
                  title: Version
                  type: string
                  enum: ['18', '17']
                  enumNames: ['PostgreSQL 18 (Latest)', 'PostgreSQL 17 (N-1)']
                  ui:field: BoxedChoice
                  ui:options:
                    columns: 2
              required: [dbVersion]

    - title: Database Configuration
      required: [dbName, dbAdminPassword]
      properties:
        dbName:
          title: Database Name
          type: string
          description: Name for the new database instance
          pattern: '^[a-zA-Z][a-zA-Z0-9]{0,7}$'
        dbAdminPassword:
          title: Admin Password
          type: string
          description: Password for the database administrator account
          ui:widget: password

    - title: Deployment Target
      required: [target]
      properties:
        target:
          title: Where do you want to deploy?
          type: string
          enum: [onprem, oci, azure]
          enumNames: ['On-Premises', 'Oracle Cloud (OCI)', 'Microsoft Azure']
      dependencies:
        target:
          oneOf:
            # ---- On-prem: free-form sizing, no license question ----
            - properties:
                target:
                  enum: [onprem]
                cpuCores:
                  title: CPU Cores
                  type: number
                  minimum: 1
                memoryGb:
                  title: Memory (GB)
                  type: number
                  minimum: 1
                storageGb:
                  title: Storage (GB)
                  type: number
                  minimum: 10
              required: [cpuCores, memoryGb, storageGb]

            # ---- OCI: license model + DB System shape dropdown ----
            - properties:
                target:
                  enum: [oci]
                licenseModel:
                  title: License Model
                  type: string
                  enum: [BYOL, LICENSE_INCLUDED]
                  enumNames:
                    ['Bring Your Own License', 'License Included (Subscription)']
                ociShape:
                  title: DB System Shape
                  type: string
                  enum:
                    - VM.Standard.E4.Flex.2.32
                    - VM.Standard.E4.Flex.4.64
                    - VM.Standard.E4.Flex.8.128
                  enumNames:
                    - '2 OCPU / 32 GB'
                    - '4 OCPU / 64 GB'
                    - '8 OCPU / 128 GB'
              required: [licenseModel, ociShape]

            # ---- Azure: license model + VM size dropdown ----
            - properties:
                target:
                  enum: [azure]
                licenseModel:
                  title: License Model
                  type: string
                  enum: [BYOL, PAYG]
                  enumNames:
                    [
                      'Bring Your Own License',
                      'Pay-As-You-Go (License Included)',
                    ]
                azureVmSize:
                  title: VM Size
                  type: string
                  enum:
                    - Standard_E4s_v5
                    - Standard_E8s_v5
                    - Standard_E16s_v5
                    - Standard_M8ms
                  enumNames:
                    - 'E4s v5 — 4 vCPU / 32 GB'
                    - 'E8s v5 — 8 vCPU / 64 GB'
                    - 'E16s v5 — 16 vCPU / 128 GB'
                    - 'M8ms — 8 vCPU / 218 GB (memory-optimized)'
              required: [licenseModel, azureVmSize]

  steps:
    # ---- Oracle: real provisioning actions, gated to dbProduct === oracle ----
    - id: provision-oci
      name: Provision Oracle DB System on OCI
      if: ${{ parameters.target === "oci" and parameters.dbProduct === "oracle" }}
      action: oracle:oci:createDbSystem
      input:
        dbName: ${{ parameters.dbName }}
        oracleVersion: ${{ parameters.dbVersion }}
        shape: ${{ parameters.ociShape }}
        licenseModel: ${{ parameters.licenseModel }}
        adminPassword: ${{ parameters.dbAdminPassword }}

    - id: provision-azure
      name: Provision Oracle DB VM on Azure
      if: ${{ parameters.target === "azure" and parameters.dbProduct === "oracle" }}
      action: oracle:azure:createVm
      input:
        dbName: ${{ parameters.dbName }}
        oracleVersion: ${{ parameters.dbVersion }}
        vmSize: ${{ parameters.azureVmSize }}
        licenseModel: ${{ parameters.licenseModel }}
        adminPassword: ${{ parameters.dbAdminPassword }}

    - id: provision-onprem
      name: Request On-Prem Provisioning
      if: ${{ parameters.target === "onprem" and parameters.dbProduct === "oracle" }}
      action: oracle:onprem:requestProvision
      input:
        dbName: ${{ parameters.dbName }}
        oracleVersion: ${{ parameters.dbVersion }}
        cpuCores: ${{ parameters.cpuCores }}
        memoryGb: ${{ parameters.memoryGb }}
        storageGb: ${{ parameters.storageGb }}

    # ---- Everything else: not automated yet ----
    - id: provision-unsupported-product
      name: Request Provisioning (Not Yet Automated)
      if: ${{ parameters.dbProduct !== "oracle" }}
      action: dbaas:unsupportedProduct:requestProvision
      input:
        dbName: ${{ parameters.dbName }}
        dbProduct: ${{ parameters.dbProduct }}
        dbVersion: ${{ parameters.dbVersion }}
        target: ${{ parameters.target }}

  output:
    links:
      - title: OCI Console
        url: ${{ steps['provision-oci'].output.consoleUrl }}
        if: ${{ parameters.target === "oci" and parameters.dbProduct === "oracle" }}
      - title: Azure Portal
        url: ${{ steps['provision-azure'].output.consoleUrl }}
        if: ${{ parameters.target === "azure" and parameters.dbProduct === "oracle" }}
